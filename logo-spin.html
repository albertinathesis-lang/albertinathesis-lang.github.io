<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAL logo spin</title>
<style>
  :root { --blue:#1925aa; --mercury:#e8e6e0; --ink:#111; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--blue); color: var(--mercury); font: 12px/1.45 ui-monospace, Menlo, "Roboto Mono", monospace;
         display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .stage { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud, .warn { position: absolute; top: 16px; text-transform: uppercase; letter-spacing: .04em; opacity: .85; pointer-events: none; }
  .hud { left: 20px; white-space: pre-wrap; max-width: calc(100% - 40px); }
  .hud b { font-weight: 500; }
  .warn { right: 20px; max-width: 360px; text-align: right; }
  @media (max-width: 800px) { .warn { left: 20px; right: 20px; top: 84px; max-width: none; text-align: left; } }
  .drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.35); border: 1px dashed var(--mercury); margin: 16px; pointer-events: none; }
  .stage.is-drag .drop { display: flex; }

  .panel { background: rgba(0,0,0,.28); padding: 14px 20px 16px; display: grid; gap: 14px 22px;
           grid-template-columns: 2.2fr 1fr 1fr 1fr; align-items: end; }
  @media (max-width: 900px) { .panel { grid-template-columns: 1fr 1fr; } }
  label, .group { display: flex; flex-direction: column; gap: 6px; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=range] { width: 100%; accent-color: var(--mercury); margin: 4px 0; }
  input[type=number], select { background: transparent; color: var(--mercury); border: 1px solid rgba(232,230,224,.5); padding: 5px 8px; font: inherit; width: 96px; }
  select { width: auto; }
  select option { color: var(--ink); }
  button, .btn { background: transparent; color: var(--mercury); border: 1px solid rgba(232,230,224,.5); padding: 6px 10px; font: inherit; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; display: inline-block; }
  button:hover, .btn:hover { background: rgba(232,230,224,.12); }
  button[aria-pressed="true"] { background: var(--mercury); color: var(--blue); border-color: var(--mercury); }
  .presets button { padding: 4px 8px; font-size: 11px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh:focus-visible + .btn, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--mercury); outline-offset: 2px; }
  .hint { opacity: .6; text-transform: none; letter-spacing: 0; }
  #dir { min-width: 84px; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Rotating AI Art Lab logo"></canvas>
    <div class="hud" id="hud"></div>
    <div class="warn" id="warn"></div>
    <div class="drop">Drop an image (PNG, SVG, WebP, JPEG) to use it as the logo</div>
  </div>

  <div class="panel">
    <div class="group">
      <span>Speed · rotations per second (1 – 1200)</span>
      <input id="speed" type="range" min="0" max="1000" value="0" step="1" aria-label="speed" aria-valuemin="1" aria-valuemax="1200" autocomplete="off">
      <div class="row">
        <input id="speedNum" type="number" min="1" max="1200" step="any" value="1" aria-label="speed value" autocomplete="off">
        <span>rps</span><span id="rpm" class="hint"></span>
        <span class="presets row">
          <button data-rps="1">1</button><button data-rps="10">10</button><button data-rps="30">30</button>
          <button data-rps="60">60</button><button data-rps="120">120</button><button data-rps="600">600</button><button data-rps="1200">1200</button>
        </span>
      </div>
    </div>

    <div class="group">
      <span>Playback</span>
      <div class="row">
        <button id="play">Pause</button>
        <button id="dir" title="reverse the direction">Reverse</button>
        <button id="reset" title="angle back to 0">Reset</button>
      </div>
      <span class="hint">space · play/pause &nbsp; ↑↓ · speed ×1.25 &nbsp; ←→ · reverse</span>
    </div>

    <div class="group">
      <span>Render</span>
      <div class="row">
        <button id="modeSampled" aria-pressed="true" title="one position per frame: what a screen can show">Sampled</button>
        <button id="modeBlur" aria-pressed="false" title="the time-average over each frame">Motion blur</button>
      </div>
      <label>Size <input id="size" type="range" min="10" max="95" value="48" aria-label="logo size" autocomplete="off"></label>
    </div>

    <div class="group">
      <span>Logo &amp; colours</span>
      <div class="row">
        <select id="logo" aria-label="logo" autocomplete="off">
          <option value="burst">AAL burst</option>
          <option value="mark">Circle &amp; cross mark</option>
          <option value="custom" disabled>Your file</option>
        </select>
        <input id="file" class="vh" type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp"><label for="file" class="btn">Load file…</label>
      </div>
      <div class="row">
        <select id="bg" aria-label="background" autocomplete="off"><option value="#1925aa">Blue ground</option><option value="#000000">Black</option><option value="#e8e6e0">Mercury</option><option value="#ffffff">White</option></select>
        <select id="fg" aria-label="logo colour" autocomplete="off"><option value="#ffffff">White logo</option><option value="#e8e6e0">Mercury</option><option value="#1925aa">Blue</option><option value="#000000">Black</option></select>
      </div>
    </div>
  </div>

  const MIN = 1, MAX = 1200, SLIDER_MAX = 1000;
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const hud = document.getElementById('hud'), warn = document.getElementById('warn');
  const $ = id => document.getElementById(id);

  // ---- state ------------------------------------------------------------
  const st = { rps: 1, dir: 1, playing: true, blur: false, size: 0.48, bg: '#1925aa', fg: '#ffffff', angle: 0,
               symmetry: 1, loadError: '' };
  let img = null, lastGood = 'burst', customURL = null, loadSeq = 0;
  let last = null, dtEMA = 1 / 60, lastSweep = 0;
  const tints = new Map();                         // colour -> canvas, for the current img/size
  let tintSize = '';
  let acc = null;                                  // motion-blur accumulator

  // ---- speed mapping: log scale, 1 → 1200 -------------------------------
  const toRps = s => MIN * Math.pow(MAX / MIN, s / SLIDER_MAX);
  const toSlider = r => Math.round(SLIDER_MAX * Math.log(r / MIN) / Math.log(MAX / MIN));
  const fmt = n => n >= 100 ? Math.round(n).toLocaleString() : (n >= 10 ? n.toFixed(1) : n.toFixed(2));
  function setRps(r, fromSlider) {
    r = Math.min(MAX, Math.max(MIN, Number(r) || MIN));
    st.rps = r;
    if (!fromSlider) $('speed').value = toSlider(r);
    $('speed').setAttribute('aria-valuetext', fmt(r) + ' rotations per second');
    const shown = r >= 100 ? Math.round(r) : Math.round(r * 100) / 100;
    $('speedNum').value = shown;
    $('rpm').textContent = '= ' + Math.round(r * 60).toLocaleString() + ' rpm';
    document.querySelectorAll('.presets button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.rps) === shown ? 'true' : 'false'));
  }

  // ---- logo loading -------------------------------------------------------
  function loadLogo(key) {
    const id = ++loadSeq;
    const im = new Image();
    im.onload = () => {
      if (id !== loadSeq) return;                          // a newer request won
      img = im; tintSize = ''; tints.clear(); st.loadError = '';
      st.symmetry = key === 'custom' ? 1 : LOGOS[key].symmetry;
      lastGood = key;
      if (key === 'custom') { const o = $('logo').querySelector('[value=custom]'); o.disabled = false; }
      $('logo').value = key;
    };
    im.onerror = () => {
      if (id !== loadSeq) return;
      st.loadError = 'could not load that image';
      $('logo').value = lastGood;
    };
    im.src = key === 'custom' ? customURL : LOGOS[key].src;
  }

  /* a copy of the logo in one flat colour: alpha from the image, colour ours */
  function tinted(w, h, colour) {
    const key = w + 'x' + h;
    if (tintSize !== key) { tints.clear(); tintSize = key; }
    let c = tints.get(colour);
    if (c) return c;
    c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h);
    const o = c.getContext('2d');
    o.drawImage(img, 0, 0, w, h);
    o.globalCompositeOperation = 'source-in';
    o.fillStyle = colour; o.fillRect(0, 0, c.width, c.height);
    tints.set(colour, c);
    return c;
  }

  // ---- canvas sizing ----------------------------------------------------
  function resize() {
    const dpr = Math.min(3, devicePixelRatio || 1);
    const r = stage.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
    tintSize = '';
  }
  addEventListener('resize', resize); resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);

  // ---- drawing ----------------------------------------------------------
  function draw(angleDeg, sweepDeg) {
    const W = canvas.width, H = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = st.bg; ctx.fillRect(0, 0, W, H);
    if (!img) return;
    const s = Math.round(Math.min(W, H) * st.size);
    if (s < 2) return;
    const ratio = img.naturalWidth / img.naturalHeight || 1;
    const w = ratio >= 1 ? s : Math.round(s * ratio), h = ratio >= 1 ? Math.round(s / ratio) : s;
    const cx = W / 2, cy = H / 2, rad = Math.PI / 180;

    if (!st.blur || Math.abs(sweepDeg) < 0.5) {
      ctx.translate(cx, cy); ctx.rotate(angleDeg * rad);
      ctx.drawImage(tinted(w, h, st.fg), -w / 2, -h / 2);
      return;
    }

    /* Motion blur = the time-average of the logo over this frame's sweep.
       Coverage is accumulated as WHITE on a transparent buffer (additive,
       1/K each), so the buffer ends up holding "fraction of the frame this
       pixel was covered" in its alpha. It is then tinted once and composited
       normally, which gives exactly (1-c)*ground + c*colour for any pair of
       colours. K is chosen so 255/K is an integer at the high end, where the
       8-bit rounding of many small passes would otherwise drift the colour. */
    const span = Math.abs(sweepDeg);
    const K = span < 68 ? Math.max(2, Math.ceil(span / 4)) : (span < 204 ? 17 : 51);
    const arc = span >= 360 ? 360 : span;               // past a full turn every angle is visited
    const step = arc / K;
    const start = span >= 360 ? angleDeg : angleDeg - sweepDeg;
    const sign = Math.sign(sweepDeg) || 1;
    const D = Math.ceil(Math.hypot(w, h)) + 2;
    if (!acc || acc.width !== D) { acc = document.createElement('canvas'); acc.width = acc.height = D; }
    const a = acc.getContext('2d');
    a.setTransform(1, 0, 0, 1, 0, 0);
    a.globalCompositeOperation = 'source-over'; a.globalAlpha = 1;
    a.clearRect(0, 0, D, D);
    const white = tinted(w, h, '#ffffff');
    a.globalCompositeOperation = 'lighter'; a.globalAlpha = 1 / K;
    for (let i = 0; i < K; i++) {
      a.setTransform(1, 0, 0, 1, 0, 0);
      a.translate(D / 2, D / 2);
      a.rotate((start + sign * step * (i + 0.5)) * rad);
      a.drawImage(white, -w / 2, -h / 2);
    }
    a.setTransform(1, 0, 0, 1, 0, 0);
    a.globalAlpha = 1; a.globalCompositeOperation = 'source-in';
    a.fillStyle = st.fg; a.fillRect(0, 0, D, D);
    ctx.drawImage(acc, Math.round(cx - D / 2), Math.round(cy - D / 2));
  }

  // ---- the loop: angle advances by rps·360·dt, whatever the frame rate --
  function step(dt) {
    const sweep = st.playing ? st.dir * st.rps * 360 * dt : 0;
    st.angle = ((st.angle + sweep) % 360 + 360) % 360;
    lastSweep = sweep;
    return sweep;

  function frame(now) {

    if (last == null) { last = now; return; }
    const raw = (now - last) / 1000;
    const dt = Math.min(0.1, raw);                       // a hidden tab must not fling the logo
    last = now;
    if (raw > 0 && raw <= 0.1) dtEMA = dtEMA * 0.9 + raw * 0.1;   // a stalled frame is not a frame-rate sample
    const sweep = step(dt);

  function updateHud() {

    const period = 360 / st.symmetry;                    // the visible period of this logo
    const periods = perFrame / period;
    hud.innerHTML = `<b>${fmt(st.rps)} rps</b>  ·  ${Math.round(st.rps * 60).toLocaleString()} rpm\n`
      + `${Math.round(fps)} fps  ·  ${fmt(perFrame)}° per frame  ·  ${fmt(perFrame / 360)} turns per frame\n`
      + `angle ${st.angle.toFixed(1)}°  ·  ${st.blur ? 'motion blur' : 'sampled'}  ·  ${st.dir > 0 ? 'cw' : 'ccw'}${st.playing ? '' : '  ·  paused'}`;
    const limit = fps / (2 * st.symmetry);               // Nyquist for this logo's visible period
    let text = '';
    if (st.loadError) text = st.loadError;
    else if (st.fg === st.bg) text = 'logo and ground are the same colour';
    else if (st.rps > limit) text = st.blur

      : `above ~${Math.round(limit)} rps the screen cannot follow this logo${st.symmetry > 1 ? ` (it repeats every ${period}°)` : ''}: this is a strobe of ${fmt(periods)} visible periods per frame, not the motion. Motion blur shows the true average.`;

  $('speedNum').addEventListener('change', e => setRps(e.target.value, false));

    if (e.target.matches('input, select, textarea, button, label, a')) return;

    else if (e.key === 'ArrowUp') { e.preventDefault(); setRps(st.rps * 1.25, false); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setRps(st.rps / 1.25, false); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); $('dir').click(); }
  });

  // ---- go: state follows the controls (a reload may restore their values) ---
  st.size = Number($('size').value) / 100; st.bg = $('bg').value; st.fg = $('fg').value;
  setRps(1, false);
  loadLogo($('logo').value === 'custom' ? 'burst' : $('logo').value);
  requestAnimationFrame(frame);
  window.__spin = { st, step, toRps, toSlider, setRps, draw, get img() { return img; } };   // for tests
})();
</script>
</body>
</html>
